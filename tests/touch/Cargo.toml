[package]
name = "ohos-touch-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
native-vsync = []
native-input = []

[dependencies]
gpui = { git = "https://github.com/ohos-rs/zed", rev = "00542402c992e7a041f110c7d2386c60a40b7038", default-features = false }
rustc-hash = "2"
log = "0.4"
libc = "0.2"
anyhow = "1"
parking_lot = "0.12"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
smallvec = "1"
image = { version = "0.25", default-features = false }

[lib]
path = "lib.rs"
