[package]
name = "ohos-touch-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
native-vsync = []
native-input = []

[dependencies]
gpui = { git = "https://github.com/ohos-rs/zed", rev = "422c92ace17512aa5ea66f73dc14044008d3e87d", default-features = false }
rustc-hash = "2"
log = "0.4"
libc = "0.2"
anyhow = "1"
parking_lot = "0.12"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[lib]
path = "lib.rs"
