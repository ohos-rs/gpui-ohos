[package]
name = "ohos-text-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[workspace.dependencies]
anyhow = "1"
cosmic-text = "0.17.0"
harfrust = "0.5.2"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", features = ["source-fontconfig-dlopen"] }
gpui = { git = "https://github.com/ohos-rs/zed", rev = "422c92ace17512aa5ea66f73dc14044008d3e87d", default-features = false }
itertools = "0.14"
log = "0.4"
parking_lot = "0.12"
rustc-hash = "2"
smallvec = { version = "1.6", features = ["union", "const_new"] }
unicode-segmentation = "1.12"
swash = "0.2.10"
url = "2"
unicode-script = "0.5"

[dependencies]
anyhow.workspace = true
cosmic-text.workspace = true
harfrust.workspace = true
font-kit.workspace = true
gpui.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
unicode-segmentation.workspace = true
swash.workspace = true
url.workspace = true
unicode-script.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lib]
path = "lib.rs"
