[package]
name = "ohos-shader-comparison"
version = "0.1.0"
edition = "2024"
[workspace]

[[bin]]
name = "ohos-shader-comparison"
path = "compare.rs"

[dependencies]
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true

[workspace.dependencies]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "8b419de0906f37af69d728f1735132e427a3436f", default-features = false, features = ["metal", "std", "wgsl", "parking_lot"] }
pollster = "0.4"
bytemuck = "1"
