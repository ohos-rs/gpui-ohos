[package]
name = "gpui-ohos-example"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "gpui_demo"
crate-type = ["cdylib"]
doctest = false
test = false

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "e30095febcfd25ae81d52e59d7d80c2bd21830c6", default-features = false }
gpui-ohos = { path = "..", default-features = false }
log = "0.4"
ohos-hilog-binding = { version = "*", features = ["log"] }
napi-derive-ohos = "=1.2.0"
napi-ohos = "=1.2.0"
openharmony-ability = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "8d66b703f9044a966eaedd720a61ed797049982d", version = "=1.0.0-beta.3" }
openharmony-ability-derive = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "8d66b703f9044a966eaedd720a61ed797049982d", version = "=1.0.0-beta.3" }
openharmony-ability-plugin-permission = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "8d66b703f9044a966eaedd720a61ed797049982d", version = "=1.0.0-beta.3" }

[features]
default = ["gles", "api-26"]
gles = ["gpui-ohos/gles"]
vulkan = ["gpui-ohos/vulkan"]
native-vsync = ["gpui-ohos/native-vsync"]
native-input = ["gpui-ohos/native-input"]
api-19 = ["gpui-ohos/api-19"]
api-26 = ["gpui-ohos/api-26"]

[build-dependencies]
napi-build-ohos = "=1.2.0"

[workspace]
resolver = "2"

exclude = ["ohos/vendor/openharmony-ability", "ohos/vendor/openharmony-ability/crates/*"]
