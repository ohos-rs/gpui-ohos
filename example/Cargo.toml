[package]
name = "gpui-ohos-example"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "gpui_demo"
crate-type = ["cdylib"]
doctest = false
test = false

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/ohos-rs/zed", rev = "422c92ace17512aa5ea66f73dc14044008d3e87d", default-features = false }
gpui-ohos = { path = "..", default-features = false }
log = "0.4"
ohos-hilog-binding = { version = "*", features = ["log"] }
napi-derive-ohos = "=1.2.0"
napi-ohos = "=1.2.0"
openharmony-ability = { path = "ohos/vendor/openharmony-ability/crates/ability", version = "=1.0.0-beta.3" }
openharmony-ability-derive = { path = "ohos/vendor/openharmony-ability/crates/derive", version = "=1.0.0-beta.3" }
openharmony-ability-plugin-permission = { path = "ohos/vendor/openharmony-ability/crates/plugin-permission", version = "=1.0.0-beta.3" }

[features]
default = ["gles"]
gles = ["gpui-ohos/gles"]
vulkan = ["gpui-ohos/vulkan"]
native-vsync = ["gpui-ohos/native-vsync"]
native-input = ["gpui-ohos/native-input"]

[build-dependencies]
napi-build-ohos = "=1.2.0"

[workspace]
resolver = "2"

exclude = ["ohos/vendor/openharmony-ability", "ohos/vendor/openharmony-ability/crates/*"]
