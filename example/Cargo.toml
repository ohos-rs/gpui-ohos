[package]
name = "gpui-ohos-example"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "gpui_demo"
crate-type = ["cdylib"]
doctest = false
test = false

[dependencies]
anyhow = "1"
gpui = { package = "gpui-pre", version = "0.3.11", default-features = false }
gpui-ohos = { path = "..", default-features = false }
log = "0.4"
ohos-hilog-binding = { version = "0.2.5", features = ["log"] }
napi-derive-ohos = "=1.2.0"
napi-ohos = "=1.2.0"
openharmony-ability = "1.0.0-beta.5"
openharmony-ability-derive = "1.0.0-beta.5"
openharmony-ability-plugin-permission = "1.0.0-beta.5"

[features]
default = ["gles", "api-26"]
gles = ["gpui-ohos/gles"]
vulkan = ["gpui-ohos/vulkan"]
native-vsync = ["gpui-ohos/native-vsync"]
native-input = ["gpui-ohos/native-input"]
api-19 = ["gpui-ohos/api-19"]
api-26 = ["gpui-ohos/api-26"]

[build-dependencies]
napi-build-ohos = "=1.2.0"

[workspace]
resolver = "2"
