[package]
name = "gpui-ohos-example"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "gpui_demo"
crate-type = ["cdylib"]
doctest = false
test = false

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/ohos-rs/zed", rev = "f45c7c22d0", default-features = false }
gpui-ohos = { path = "..", default-features = false }
log = "0.4"
ohos-hilog-binding = { version = "*", features = ["log"] }
napi-derive-ohos = "=1.2.0"
napi-ohos = "=1.2.0"
openharmony-ability = "=1.0.0-beta.3"
openharmony-ability-derive = "=1.0.0-beta.3"
openharmony-ability-plugin-permission = "=1.0.0-beta.3"

[features]
default = ["gles"]
gles = ["gpui-ohos/gles"]
vulkan = ["gpui-ohos/vulkan"]
native-vsync = ["gpui-ohos/native-vsync"]

[build-dependencies]
napi-build-ohos = "=1.2.0"

[workspace]
resolver = "2"
exclude = ["ohos/vendor/openharmony-ability", "ohos/vendor/openharmony-ability/crates/*"]
