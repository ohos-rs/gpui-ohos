[workspace]
members = []
exclude = ["example", "tests/touch"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
accesskit_ohos = { git = "https://github.com/richerfu/accesskit.git", rev = "ea2d8c4", features = ["api-15"] }
libc = "0.2"
anyhow = "1"
bytemuck = "1"
crossbeam-channel = "0.5"
cosmic-text = "0.17.0"
etagere = "0.2"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", features = ["source-fontconfig-dlopen"] }
futures = "0.3.34"
gpui = { git = "https://github.com/ohos-rs/zed", rev = "f45c7c22d0", default-features = false }
itertools = "0.14.0"
image = { version = "0.25.1", default-features = false }
log = "0.4"
ohos-accessibility-binding = "0.1"
ohos-asset-binding = "0.1.5"
ohos-fileuri-binding = "0.1"
ohos-fileshare-binding = "0.1"
ohos-vsync-binding = { version = "0.3.1", default-features = false, features = ["api-20"] }
napi-ohos = "=1.2.0"
napi-derive-ohos = "=1.2.0"
# GPUI uses owned ArkUI key events, mouse cancellation, and native file drag/drop on every backend.
openharmony-ability = { version = "=1.0.0-beta.3", features = ["keyboard", "mouse", "drag"] }
openharmony-ability-plugin-menu = "=1.0.0-beta.3"
openharmony-ability-plugin-notification = "=1.0.0-beta.3"
openharmony-ability-plugin-system-state = "=1.0.0-beta.3"
openharmony-ability-plugin-app-control = "=1.0.0-beta.3"
openharmony-ability-plugin-clipboard = "=1.0.0-beta.3"
openharmony-ability-plugin-files = "=1.0.0-beta.3"
openharmony-ability-plugin-process = "=1.0.0-beta.3"
openharmony-ability-plugin-url = "=1.0.0-beta.3"
openharmony-ability-plugin-window = "=1.0.0-beta.3"
parking_lot = "0.12.1"
profiling = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
rustc-hash = "2"
smallvec = { version = "1.6", features = ["union", "const_new"] }
sha2 = "0.10"
smol = "2.0"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
url = "2"
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "8b419de0906f37af69d728f1735132e427a3436f", default-features = false, features = ["parking_lot", "std", "wgsl"] }

[package]
name = "gpui-ohos"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "OpenHarmony platform support for GPUI"
repository = "https://github.com/ohos-rs/gpui-ohos"

[features]
default = ["gles"]
gles = ["wgpu/gles"]
vulkan = ["wgpu/vulkan"]
native-vsync = ["dep:ohos-vsync-binding"]

[lib]
name = "gpui_ohos"
path = "src/gpui_ohos.rs"

[dependencies]
accesskit_ohos.workspace = true
gpui.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
cosmic-text.workspace = true
etagere.workspace = true
font-kit.workspace = true
futures.workspace = true
itertools.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
ohos-accessibility-binding.workspace = true
ohos-asset-binding.workspace = true
ohos-fileuri-binding.workspace = true
ohos-fileshare-binding.workspace = true
ohos-vsync-binding = { workspace = true, optional = true }
openharmony-ability.workspace = true
openharmony-ability-plugin-menu.workspace = true
openharmony-ability-plugin-notification.workspace = true
openharmony-ability-plugin-system-state.workspace = true
openharmony-ability-plugin-app-control.workspace = true
openharmony-ability-plugin-clipboard.workspace = true
openharmony-ability-plugin-files.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
serde.workspace = true
openharmony-ability-plugin-process.workspace = true
napi-ohos.workspace = true
napi-derive-ohos.workspace = true
url.workspace = true
openharmony-ability-plugin-url.workspace = true
openharmony-ability-plugin-window.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
sha2.workspace = true
smol.workspace = true
uuid.workspace = true
wgpu.workspace = true
