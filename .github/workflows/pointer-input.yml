name: Pointer input

on:
  pull_request:
  push:
    branches: [main]

jobs:
  host-tests:
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path tests/touch/Cargo.toml --locked --features native-vsync
