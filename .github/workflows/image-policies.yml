name: Image policy regressions

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  image-policies:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/text/requirements.txt
      - name: Run production image ownership and sprite encoding tests
        run: cargo test -p ohos-text-tests --release --locked image_alpha
